<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password — 5 Star Fitness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; }

    :root {
      --accent:       #f59e0b;
      --accent-hover: #fbbf24;
      --accent-dim:   rgba(245,158,11,0.12);
      --bg-page:      #111111;
      --bg-card:      #1c1c1c;
      --bg-input:     #2a2a2a;
      --border:       #333333;
      --border-subtle:#1e1e1e;
      --text-primary: #ffffff;
      --text-body:    #cccccc;
      --text-muted:   #888888;
      --text-disabled:#666666;
      --danger:       #ef4444;
      --danger-dim:   rgba(239,68,68,0.12);
      --danger-border:rgba(239,68,68,0.3);
      --radius-full:  9999px;
      --radius-xl:    16px;
    }

    body {
      background: var(--bg-page);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(245,158,11,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245,158,11,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(245,158,11,0.06);
      animation: cardEnter 0.45s cubic-bezier(.4,0,.2,1);
      position: relative;
      z-index: 1;
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .input-field {
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 18px;
      width: 100%;
      font-size: 0.875rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      outline: none;
    }
    .input-field::placeholder { color: var(--text-disabled); }
    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .btn-login {
      background: var(--accent);
      color: #000000;
      border-radius: var(--radius-full);
      padding: 12px 32px;
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }
    .btn-login:hover {
      background: var(--accent-hover);
      transform: scale(1.02);
      box-shadow: 0 4px 20px rgba(245,158,11,0.3);
    }
    .btn-login:active { transform: scale(0.99); }

    label {
      color: var(--text-muted);
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 8px;
    }

    .errorlist { list-style: none; margin: 0 0 6px; padding: 0; }
    .errorlist li {
      font-size: 0.75rem;
      color: var(--danger);
      background: var(--danger-dim);
      border: 1px solid var(--danger-border);
      border-radius: 8px;
      padding: 6px 10px;
    }
  </style>
</head>
<body>
  <div class="relative z-10 w-full max-w-md px-4">
    <div class="login-card p-8">

      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-xl flex items-center justify-center mx-auto mb-5" style="background:var(--accent)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2"/>
            <path d="M8 10V7a4 4 0 118 0v3"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold" style="color:var(--text-primary)">Set a New Password</h1>
        <p class="text-sm mt-1" style="color:var(--text-muted)">
          You must set your own password before continuing.
        </p>
      </div>

      <form method="post" class="space-y-4">
        {% csrf_token %}

        {% if form.non_field_errors %}
        <div class="px-4 py-3 text-sm" style="background:var(--danger-dim);border:1px solid var(--danger-border);color:var(--danger);border-radius:8px">
          {{ form.non_field_errors }}
        </div>
        {% endif %}

        {% for field in form %}
        <div>
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field.errors }}
          <input id="{{ field.id_for_label }}" type="password" name="{{ field.html_name }}"
            class="input-field" autocomplete="new-password" required {% if forloop.first %}autofocus{% endif %} />
          {% if field.help_text %}
          <p class="text-xs mt-1" style="color:var(--text-muted)">{{ field.help_text|safe }}</p>
          {% endif %}
        </div>
        {% endfor %}

        <button type="submit" class="btn-login">Change Password</button>
      </form>
    </div>
  </div>
</body>
</html>
