{% extends 'base.html' %}
{% block title %}{{ action }} User — 5 Star Fitness{% endblock %}
{% block page_title %}{{ action }} User{% endblock %}

{% block content %}
<div class="max-w-md" style="background:#181818;border:1px solid #282828;border-radius:8px;padding:24px">
  <form method="post" class="space-y-4">
    {% csrf_token %}

    {% if action == 'Create' %}
    <div>
      <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:#b3b3b3;margin-bottom:8px">Username</label>
      <input type="text" name="username" required class="glow-input" />
    </div>
    {% else %}
    <div>
      <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:#b3b3b3;margin-bottom:8px">Username</label>
      <input type="text" value="{{ u.username }}" disabled class="glow-input" style="opacity:0.5;cursor:not-allowed" />
    </div>
    {% endif %}

    <div>
      <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:#b3b3b3;margin-bottom:8px">Email</label>
      <input type="email" name="email" value="{% if u %}{{ u.email }}{% endif %}" class="glow-input" />
    </div>

    <div>
      <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:#b3b3b3;margin-bottom:8px">
        Password
        {% if action == 'Edit' %}<span style="font-weight:400;text-transform:none;letter-spacing:0;color:#b3b3b3;font-size:11px;margin-left:4px">— leave blank to keep current</span>{% endif %}
      </label>
      <input type="password" name="password" {% if action == 'Create' %}required{% endif %} class="glow-input" />
    </div>

    <div>
      <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:#b3b3b3;margin-bottom:8px">Role</label>
      <select name="role" class="glow-input" style="border-radius:8px !important">
        <option value="staff" {% if u and u.profile.role == 'staff' %}selected{% endif %}>Staff</option>
        <option value="admin" {% if u and u.profile.role == 'admin' %}selected{% endif %}>Admin</option>
      </select>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit"
        style="padding:12px 28px;background:#1ed760;color:#000;border-radius:9999px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;border:none;cursor:pointer;transition:background 0.15s"
        onmouseover="this.style.background='#1fdf64'" onmouseout="this.style.background='#1ed760'">
        {{ action }} User
      </button>
      <a href="/accounts/users/" class="cancel-btn">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
