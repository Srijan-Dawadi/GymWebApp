<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — 5 Star Fitness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'CircularSp', 'Helvetica Neue', helvetica, arial, sans-serif; }

    body {
      background: #121212;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .login-card {
      background: #181818;
      border: 1px solid #282828;
      border-radius: 8px;
      box-shadow: rgba(0,0,0,0.5) 0px 8px 24px;
      animation: cardEnter 0.5s cubic-bezier(.4,0,.2,1);
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .input-field {
      background: #1f1f1f;
      color: #ffffff;
      border: none;
      border-radius: 500px;
      padding: 12px 20px;
      width: 100%;
      font-size: 14px;
      box-shadow: rgb(18,18,18) 0px 1px 0px, rgb(124,124,124) 0px 0px 0px 1px inset;
      transition: box-shadow 0.15s ease;
      outline: none;
    }
    .input-field::placeholder { color: #6b6b6b; }
    .input-field:focus {
      box-shadow: rgb(18,18,18) 0px 1px 0px, #ffffff 0px 0px 0px 1px inset;
    }

    .btn-login {
      background: #1ed760;
      color: #000000;
      border-radius: 9999px;
      padding: 14px 32px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn-login:hover {
      background: #1fdf64;
      transform: scale(1.02);
    }
    .btn-login:active { transform: scale(0.99); }

    label { color: #b3b3b3; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.4px; display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="relative z-10 w-full max-w-sm px-4">
    <div class="login-card p-8">

      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-full flex items-center justify-center text-3xl mx-auto mb-5" style="background:#1ed760">
          <span style="color:#000">💪</span>
        </div>
        <h1 class="text-2xl font-bold" style="color:#ffffff">5 Star Fitness</h1>
        <p class="text-sm mt-1" style="color:#b3b3b3">Sign in to your account</p>
      </div>

      <form method="post" class="space-y-5">
        {% csrf_token %}

        {% if form.non_field_errors %}
        <div class="px-4 py-3 text-sm flex items-center gap-2" style="background:rgba(243,114,127,0.1);border:1px solid rgba(243,114,127,0.3);color:#f3727f;border-radius:8px">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          {{ form.non_field_errors }}
        </div>
        {% endif %}

        <div>
          <label>Username</label>
          <input type="text" name="username" value="{{ form.username.value|default:'' }}"
            class="input-field" placeholder="Enter your username" autofocus />
        </div>

        <div>
          <label>Password</label>
          <input type="password" name="password"
            class="input-field" placeholder="Enter your password" />
        </div>

        <button type="submit" class="btn-login">Sign In</button>
      </form>

      <p class="text-center text-xs mt-6" style="color:#6b6b6b">Gym Management System</p>
    </div>
  </div>
</body>
</html>
